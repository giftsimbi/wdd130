<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Table Activity-WDD 130</title>
    <link rel="stylesheet" href="styles/table.css">
</head>
<main>
    <h1>Table Exercise Example</h1>
    <table>
        <caption>Team Records and Player Counts by League </caption>
        <thead>
            <tr>
                <th scope="col">League</th>
                <th scope="col">Team</th>
                <th scope="col">Record</th>
                <th scope="col"> Player Count</th>
            </tr>
        </thead>
        <tr>
        <tr>
            <td rowspan="3">Southern</td>
            <td>Parana</td>
            <td>52-19</td>
            <td>23</td>
        </tr>
        <tr>
            <td>Catarina</td>
            <td>49-24</td>
            <td>10</td>
        </tr>
        <tr>
            <td>Lacerda</td>
            <td>92-70</td>
            <td>27</td>
        </tr>
        <tr>
            <td rowspan="2">Western</td>
            <td>Acre</td>
            <td>75-87</td>
            <td>20</td>
        </tr>
        <tr>
            <td>Romania</td>
            <td>10-7</td>
            <td>12</td>
        </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3">Total Players</td>
                <td>Total Players 92</td>
            </tr>
        </tfoot>
    </table>
</main>
